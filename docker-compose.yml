# Base de datos de desarrollo para Clínica Sunny.
#
#   docker compose up -d      → crea MySQL con el esquema y los datos de demostración
#   docker compose down -v    → la elimina por completo (se recrea limpia la próxima vez)
#
# Las credenciales son solo para desarrollo local: el puerto se publica
# únicamente en 127.0.0.1.

services:
  db:
    image: mysql:8.4
    container_name: clinica-sunny-db
    environment:
      MYSQL_DATABASE: clinicasunny
      MYSQL_USER: clinica
      MYSQL_PASSWORD: clinica
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - clinica-sunny-datos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uclinica -pclinica --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clinica-sunny-datos:
